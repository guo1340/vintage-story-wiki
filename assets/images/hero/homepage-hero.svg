<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Vintage Story inspired voxel survival camp with forest, forge, windmill and temporal rift">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16212a"/>
      <stop offset=".34" stop-color="#4b6d78"/>
      <stop offset=".66" stop-color="#7b7049"/>
      <stop offset="1" stop-color="#2b1d14"/>
    </linearGradient>
    <linearGradient id="rift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset=".45" stop-color="#75a9c7"/>
      <stop offset="1" stop-color="#244660"/>
    </linearGradient>
    <linearGradient id="forge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdf86"/>
      <stop offset=".5" stop-color="#d9732f"/>
      <stop offset="1" stop-color="#602616"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .18"/>
      </feComponentTransfer>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

